<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKSSF Poster Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">SKSSF</div>
            <h1>Poster Generator</h1>
            <p>Create your personalized campaign poster in seconds.</p>
        </header>

        <main>
            <div class="card glass">
                <div class="form-group">
                    <label for="userName">Full Name</label>
                    <input type="text" id="userName" placeholder="Enter your name" maxlength="30">
                </div>

                <div class="form-group">
                    <label for="imageUpload">Profile Photo</label>
                    <div class="upload-area" id="dropZone">
                        <input type="file" id="imageUpload" accept="image/*" hidden>
                        <div class="upload-content">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <p>Click or drag to upload photo</p>
                        </div>
                        <img id="imagePreview" class="preview-img hidden">
                    </div>
                </div>

                <button id="generateBtn" class="btn-primary">Generate Poster</button>
            </div>

            <div id="resultArea" class="result-area hidden">
                <div class="poster-preview-container">
                    <canvas id="posterCanvas"></canvas>
                </div>
                <div class="actions">
                    <button id="downloadBtn" class="btn-secondary">Download Poster (PNG)</button>
                    <button id="resetBtn" class="btn-text">Create Another</button>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 SKSSF Relief Cell. All rights reserved.</p>
        </footer>
    </div>
    <script src="main.js"></script>
</body>

</html>
